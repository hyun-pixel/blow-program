<!doctype html>
<html lang="ko">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="margin:0;padding:32px 20px;background:#f5f6f8;color:#20242c;font-family:Arial,sans-serif;line-height:1.6">
    <main style="max-width:480px;margin:0 auto;padding:32px;background:#fff;border:1px solid #d9dde3;border-radius:12px">
      <p style="margin:0 0 24px;font-weight:700">BLOW</p>
      <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3">비밀번호 재설정</h1>
      <p>BLOW의 ‘비밀번호 찾기’ 화면에 아래 인증번호를 입력해 주세요.</p>
      <p style="margin:24px 0;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums">{{ .Token }}</p>
      <p>인증번호를 확인한 뒤 새 비밀번호를 설정할 수 있습니다. 인증 앱이 등록된 계정은 추가 인증도 필요합니다.</p>
      <p>가장 최근에 받은 번호를 사용해 주세요. 만료된 경우 BLOW에서 다시 받을 수 있습니다.</p>
      <p style="margin:24px 0 0;color:#59616f">본인이 요청하지 않았다면 이 메일을 무시해 주세요. 인증번호와 비밀번호는 다른 사람에게 알려주지 마세요.</p>
    </main>
  </body>
</html>
